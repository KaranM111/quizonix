<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quizonix | Test</title>

<link rel="stylesheet" href="css/test.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://kit.fontawesome.com/6b4d3cb5f3.js" crossorigin="anonymous"></script>

</head>

<body>

<div class="container">

<header>

<div class="logo">

<h1>Quizonix</h1>

</div>

<div class="timer">

<i class="fa-solid fa-clock"></i>

<span id="time">

45:00

</span>

</div>

</header>

<section class="question-card">

<div class="question-top">

<h2>

Question

<span id="questionNo">

1

</span>

/

<span id="totalQuestions">

30

</span>

</h2>

<div class="progress">

<div class="progress-bar" id="progressBar"></div>

</div>

</div>

<h3 id="question">

Which of the following is a valid Java identifier?

</h3>

<div class="options">

<label>

<input type="radio" name="option">

public

</label>

<label>

<input type="radio" name="option">

1variable

</label>

<label>

<input type="radio" name="option">

_myVariable

</label>

<label>

<input type="radio" name="option">

class

</label>

</div>

<div class="buttons">

<button id="previousBtn">

Previous

</button>

<button id="nextBtn">

Next

</button>

<button id="submitBtn">

Submit Test

</button>

</div>

</section>

<section class="navigator">

<h2>

Question Navigator

</h2>

<div class="numbers">

<button class="num active">

1

</button>

<button class="num">

2

</button>

<button class="num">

3

</button>

<button class="num">

4

</button>

<button class="num">

5

</button>

<button class="num">

6

</button>

<button class="num">

7

</button>

<button class="num">

8

</button>

<button class="num">

9

</button>

<button class="num">

10

</button>

<button class="num">

11

</button>

<button class="num">

12

</button>

<button class="num">

13

</button>

<button class="num">

14

</button>

<button class="num">

15

</button>

<button class="num">

16

</button>

<button class="num">

17

</button>

<button class="num">

18

</button>

<button class="num">

19

</button>

<button class="num">

20

</button>

<button class="num">

21

</button>

<button class="num">

22

</button>

<button class="num">

23

</button>

<button class="num">

24

</button>

<button class="num">

25

</button>

<button class="num">

26

</button>

<button class="num">

27

</button>

<button class="num">

28

</button>

<button class="num">

29

</button>

<button class="num">

30

</button>

</div>

</section>

</div>

<script src="js/test.js"></script>

</body>

</html>
