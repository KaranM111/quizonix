<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quizonix | Result</title>

<link rel="stylesheet" href="css/result.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://kit.fontawesome.com/6b4d3cb5f3.js" crossorigin="anonymous"></script>

</head>

<body>

<div class="container">

<div class="result-card">

<i class="fa-solid fa-trophy trophy"></i>

<h1>Test Completed 🎉</h1>

<p>Your test has been submitted successfully.</p>

<div class="stats">

<div class="stat">

<h2 id="score">26</h2>

<span>Score</span>

</div>

<div class="stat">

<h2 id="correct">26</h2>

<span>Correct</span>

</div>

<div class="stat">

<h2 id="wrong">4</h2>

<span>Wrong</span>

</div>

<div class="stat">

<h2 id="accuracy">86%</h2>

<span>Accuracy</span>

</div>

</div>

<div class="buttons">

<button id="leaderboardBtn">

Leaderboard

</button>

<button id="dashboardBtn">

Dashboard

</button>

</div>

</div>

</div>

<script src="js/result.js"></script>

</body>

</html>
