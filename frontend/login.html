<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizonix | Login</title>

    <link rel="stylesheet" href="css/login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <script src="https://kit.fontawesome.com/6b4d3cb5f3.js" crossorigin="anonymous"></script>
</head>

<body>

    <div class="background"></div>

    <header>

        <div class="logo">

            <h1>Quizonix</h1>

        </div>

    </header>

    <main>

        <div class="login-card">

            <div class="top">

                <h2>Welcome Back 👋</h2>

                <p>Sign in to continue</p>

            </div>

            <form id="loginForm">

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="College Email"
                        required>

                </div>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        required>

                    <i
                        class="fa-solid fa-eye"
                        id="togglePassword"></i>

                </div>

                <div class="role">

                    <label>

                        <input
                            type="radio"
                            name="role"
                            value="student"
                            checked>

                        Student

                    </label>

                    <label>

                        <input
                            type="radio"
                            name="role"
                            value="admin">

                        Admin

                    </label>

                </div>

                <button type="submit">

                    Login

                </button>

            </form>

            <div class="bottom">

                <p>

                    Don't have an account?

                    <a href="register.html">

                        Register

                    </a>

                </p>

            </div>

        </div>

    </main>

    <script src="js/login.js"></script>

</body>

</html>
