<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quizonix - Quizzes</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="navbar">
    <a class="brand" href="/index.html">Quizonix</a>
    <div class="nav-links" id="nav-links"></div>
  </nav>

  <div class="container wide">
    <div class="card">
      <h1>Available Quizzes</h1>
      <p class="subtitle">Pick a quiz below. Once you start, the timer cannot be paused.</p>
      <div class="quiz-list" id="quiz-list"><p class="muted">Loading...</p></div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script>
    (async () => {
      const user = await requireLogin();
      if (!user) return;
      if (user.role === 'admin') { window.location.href = '/admin.html'; return; }

      const list = document.getElementById('quiz-list');
      try {
        const { quizzes } = await api('/quiz');
        if (!quizzes.length) {
          list.innerHTML = '<p class="muted">No quizzes have been published yet. Check back soon!</p>';
          return;
        }
        list.innerHTML = quizzes.map(q => {
          const done = q.my_score !== null && q.my_score !== undefined;
          return `
            <div class="quiz-item">
              <div>
                <div style="font-weight:700">${q.title}</div>
                <div class="muted">${q.unit ? 'Unit: ' + q.unit + ' · ' : ''}${q.total_questions} MCQs · ${q.duration_minutes} min</div>
              </div>
              ${done
                ? `<span class="badge">Scored ${q.my_score}/${q.my_total}</span>`
                : `<a class="btn" href="/quiz.html?id=${q.id}">Start Test</a>`}
            </div>`;
        }).join('');
      } catch (e) {
        list.innerHTML = `<p class="error">${e.message}</p>`;
      }
    })();
  </script>
</body>
</html>
